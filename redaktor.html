<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Редактор схемы метро — Геномед</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1E293B;--muted:#64748B;--faint:#94A3B8;--sans:"Inter",-apple-system,sans-serif;
    --display:"Montserrat",var(--sans)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{font-family:var(--sans);color:var(--ink);background:#F8FAFC}

  .bar{position:fixed;left:14px;top:14px;z-index:10;display:flex;gap:8px;align-items:center;
    background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:8px;
    box-shadow:0 10px 30px rgba(30,41,59,.12);flex-wrap:wrap;max-width:calc(100vw - 28px)}
  .btn{border:none;cursor:pointer;border-radius:9px;font-family:var(--display);font-weight:700;font-size:.8rem;
    padding:9px 13px;transition:.15s;white-space:nowrap}
  .btn--p{background:#0093C9;color:#fff} .btn--p:hover{background:#0079AC}
  .btn--g{background:#F1F5F9;color:var(--ink)} .btn--g:hover{background:#E2E8F0}
  .btn.on{background:#0F172A;color:#fff}
  .sep{width:1px;height:24px;background:#E2E8F0}
  .chk{display:flex;align-items:center;gap:7px;font-size:.78rem;color:var(--muted);cursor:pointer;
    user-select:none;padding:0 6px;white-space:nowrap}
  .cnt{font-family:var(--display);font-weight:800;font-size:.8rem;padding:0 8px;white-space:nowrap}
  .cnt.ok{color:#16A34A} .cnt.bad{color:#DC2626}

  #cv{position:fixed;inset:0;background:
    linear-gradient(#E7EDF5 1px,transparent 1px) 0 0/40px 40px,
    linear-gradient(90deg,#E7EDF5 1px,transparent 1px) 0 0/40px 40px,#F8FAFC}
  svg{width:100%;height:100%;display:block;cursor:grab}
  svg.grabbing{cursor:grabbing}

  .ln{fill:none;stroke-linecap:round;stroke-linejoin:round}
  .ln.pick{stroke-width:22;stroke:transparent;cursor:pointer}
  .vtx{fill:#fff;stroke:#0F172A;stroke-width:2;cursor:move}
  .vtx:hover{fill:#FDE68A}
  .vtx.end{stroke-dasharray:3 2}
  .st circle.r{fill:#fff;stroke-width:3.4;cursor:move}
  .st.sel circle.r{stroke-width:5.5;filter:drop-shadow(0 4px 14px rgba(30,41,59,.4))}
  .hub{cursor:move}
  .lb{font-family:var(--sans);font-weight:600;font-size:12.5px;fill:var(--ink);paint-order:stroke;
    stroke:#fff;stroke-width:3.6px;stroke-linejoin:round;pointer-events:none;user-select:none}
  .lb.clash{fill:#DC2626;stroke:#FFF1F2}
  #edit{position:fixed;display:none;font-family:var(--sans);font-size:13px;font-weight:600;padding:7px 10px;
    border:2px solid #0093C9;border-radius:9px;outline:none;box-shadow:0 8px 24px rgba(30,41,59,.25);
    z-index:20;min-width:250px}
  .help{position:fixed;left:14px;bottom:14px;z-index:10;background:rgba(15,23,42,.9);color:#fff;
    font-size:.75rem;padding:9px 13px;border-radius:10px;line-height:1.65;pointer-events:none;max-width:520px}
  .help b{color:#67E8F9}
</style>
</head>
<body>

<div class="bar">
  <button class="btn btn--g on" id="mVtx">Форма веток</button>
  <button class="btn btn--g on" id="mSt">Станции</button>
  <div class="sep"></div>
  <label class="chk"><input type="checkbox" id="snap" checked> сетка 10</label>
  <span class="cnt" id="cnt">—</span>
  <div class="sep"></div>
  <button class="btn btn--p" id="exp">Сохранить</button>
  <button class="btn btn--g" id="imp">Загрузить</button>
  <button class="btn btn--g" id="rst">Сбросить</button>
  <input type="file" id="file" accept=".json" style="display:none">
</div>

<div id="cv"><svg id="svg"></svg></div>
<input id="edit" spellcheck="false">
<div class="help">
  <b>Белые квадратики</b> на линии — форма ветки, тяните их · <b>двойной клик по линии</b> — добавить излом ·
  <b>правый клик по квадратику</b> — убрать<br>
  <b>Кружок</b> — станция, тяните · <b>двойной клик</b> — переименовать · <b>Tab</b> — подпись вокруг станции ·
  <b>колесо</b> — масштаб · <b>фон</b> — сдвинуть
</div>

<script>
const D = {"lines":[{"key":"tech","name":"Технологии и производство","short":"Технологии","hex":"#14B8A6"},{"key":"lab","name":"Лаборатория","short":"Лаборатория","hex":"#00AEEF"},{"key":"eng","name":"Инженерия и производство","short":"Инженерия","hex":"#64748B"},{"key":"rnd","name":"R&D и наука","short":"R&D","hex":"#7C5CFC"},{"key":"cs","name":"Клиентский сервис и продажи","short":"Продажи","hex":"#E24A8B"},{"key":"proc","name":"Процессы и ИИ","short":"Процессы","hex":"#FF8C42"},{"key":"hr","name":"Персонал и управление","short":"Персонал","hex":"#2BB673"},{"key":"fin","name":"Финансы и учёт","short":"Финансы","hex":"#F59E0B"},{"key":"ops","name":"Приём и качество","short":"Приём","hex":"#EF4444"}],"routes":{"lab":[[200,540],[700,540],[820,420],[1300,420]],"tech":[[380,420],[490,420],[750,160],[1300,160]],"rnd":[[200,780],[315,780],[805,290],[1300,290]],"eng":[[200,1160],[220,1160],[900,480],[1300,480]],"cs":[[200,660],[760,660],[880,540],[1300,540]],"proc":[[200,290],[445,290],[935,780],[1300,780]],"hr":[[200,160],[220,160],[960,900],[1300,900]],"fin":[[200,900],[875,900],[1025,1050],[1300,1050]],"ops":[[200,1030],[925,1030],[1075,1180],[1300,1180]]},"stations":[{"id":"lab-0","line":"lab","col":0,"full":"Лаборант","short":"Лаборант","x":200,"y":540,"lp":"up"},{"id":"lab-1","line":"lab","col":1,"full":"Старший лаборант","short":"Ст. лаборант","x":430,"y":540,"lp":"down"},{"id":"lab-2","line":"lab","col":2,"full":"Молекулярный биолог","short":"Молбиолог","x":753,"y":487,"lp":"up"},{"id":"lab-3","line":"lab","col":3,"full":"Старший молекулярный биолог","short":"Ст. молбиолог","x":1174,"y":420,"lp":"down"},{"id":"lab-4","line":"lab","col":4,"full":"Заведующий отделом лаборатории","short":"Зав. отделом лаб.","x":1300,"y":420,"lp":"right"},{"id":"tech-0","line":"tech","col":0,"full":"Старший лаборант (ВПС)","short":"Ст. лаборант (ВПС)","x":380,"y":420,"lp":"down"},{"id":"tech-1","line":"tech","col":1,"full":"Молекулярный биолог (ВПС)","short":"Молбиолог (ВПС)","x":594,"y":316,"lp":"down"},{"id":"tech-2","line":"tech","col":2,"full":"Заведующий отделом пробоподготовки","short":"Зав. пробоподготовкой","x":786,"y":160,"lp":"up"},{"id":"tech-3","line":"tech","col":3,"full":"Заместитель заведующего лабораторией по технологиям","short":"Зам. зав. по технологиям","x":1043,"y":160,"lp":"down"},{"id":"tech-4","line":"tech","col":4,"full":"Директор по техническому развитию (СТО)","short":"Директор тех. развития","x":1300,"y":160,"lp":"right"},{"id":"rnd-0","line":"rnd","col":0,"full":"Лаборант (НПО)","short":"Лаборант (НПО)","x":200,"y":780,"lp":"up"},{"id":"rnd-1","line":"rnd","col":1,"full":"Старший специалист (НПО)","short":"Ст. специалист (НПО)","x":458,"y":637,"lp":"down"},{"id":"rnd-2","line":"rnd","col":2,"full":"Ведущий специалист (НПО)","short":"Ведущий спец. (НПО)","x":866,"y":290,"lp":"up"},{"id":"rnd-3","line":"rnd","col":3,"full":"Заместитель руководителя департамента R&D","short":"Зам. рук. R&D","x":1300,"y":290,"lp":"right"},{"id":"eng-0","line":"eng","col":0,"full":"Инженер-электроник","short":"Инженер-электроник","x":200,"y":1160,"lp":"up"},{"id":"eng-1","line":"eng","col":1,"full":"Старший инженер-электроник","short":"Ст. инженер-электроник","x":1037,"y":480,"lp":"left"},{"id":"eng-2","line":"eng","col":2,"full":"Заместитель руководителя отдела производства, эксплуатации и ремонта","short":"Зам. рук. производства","x":1300,"y":480,"lp":"right"},{"id":"cs-0","line":"cs","col":0,"full":"Лаборант (сервисные научные проекты)","short":"Лаборант (серв.)","x":200,"y":660,"lp":"up"},{"id":"cs-1","line":"cs","col":1,"full":"Менеджер по сопровождению клиентов B2C","short":"Менеджер B2C","x":307,"y":660,"lp":"down"},{"id":"cs-2","line":"cs","col":2,"full":"Старший молекулярный биолог (сервисные научные проекты)","short":"Ст. молбиолог (серв.)","x":528,"y":660,"lp":"up"},{"id":"cs-3","line":"cs","col":3,"full":"Менеджер по сопровождению B2C/B2B/B2D","short":"Менеджер B2C/B2B/B2D","x":612,"y":660,"lp":"down"},{"id":"cs-4","line":"cs","col":4,"full":"Менеджер по продажам услуг научного сервиса","short":"Менеджер продаж науч. сервиса","x":829,"y":591,"lp":"up"},{"id":"cs-5","line":"cs","col":5,"full":"Ведущий менеджер по сопровождению","short":"Ведущий менеджер","x":972,"y":540,"lp":"down"},{"id":"cs-6","line":"cs","col":6,"full":"Продакт-менеджер направления продаж продукции для молекулярно-биологических исследований","short":"Продакт-менеджер","x":1136,"y":540,"lp":"up"},{"id":"cs-7","line":"cs","col":7,"full":"Руководитель отдела прикладных решений и клиентской поддержки","short":"Рук. прикладных решений","x":1300,"y":540,"lp":"right"},{"id":"proc-0","line":"proc","col":0,"full":"Специалист по процессному управлению","short":"Спец. по процессам","x":200,"y":290,"lp":"up"},{"id":"proc-1","line":"proc","col":1,"full":"Ведущий специалист по процессному управлению","short":"Ведущий спец. по процессам","x":708,"y":553,"lp":"down"},{"id":"proc-2","line":"proc","col":2,"full":"Руководитель отдела разработки ИИ","short":"Рук. разработки ИИ","x":886,"y":731,"lp":"up"},{"id":"proc-3","line":"proc","col":3,"full":"Заместитель директора департамента процессного управления и развития","short":"Зам. директора департамента","x":1300,"y":780,"lp":"right"},{"id":"hr-0","line":"hr","col":0,"full":"Менеджер по персоналу","short":"Менеджер по персоналу","x":200,"y":160,"lp":"up"},{"id":"hr-1","line":"hr","col":1,"full":"Ведущий менеджер по персоналу","short":"Ведущий менеджер HR","x":282,"y":222,"lp":"up"},{"id":"hr-2","line":"hr","col":2,"full":"Руководитель ОКС","short":"Рук. ОКС","x":537,"y":477,"lp":"up"},{"id":"hr-3","line":"hr","col":3,"full":"Оперативный директор","short":"Оперативный директор","x":703,"y":643,"lp":"down"},{"id":"hr-4","line":"hr","col":4,"full":"Директор департамента процессного управления и развития","short":"Директор департамента","x":869,"y":809,"lp":"up"},{"id":"hr-5","line":"hr","col":5,"full":"Директор по персоналу","short":"Директор по персоналу","x":1066,"y":900,"lp":"down"},{"id":"hr-6","line":"hr","col":6,"full":"Заместитель генерального директора по управлению персоналом холдинга","short":"Зам. ген. директора","x":1300,"y":900,"lp":"right"},{"id":"fin-0","line":"fin","col":0,"full":"Финансовый контролёр","short":"Фин. контролёр","x":200,"y":900,"lp":"up"},{"id":"fin-1","line":"fin","col":1,"full":"Заместитель руководителя отдела первичного учёта","short":"Зам. рук. первичного учёта","x":587,"y":900,"lp":"down"},{"id":"fin-2","line":"fin","col":2,"full":"Экономист по управленческому учёту","short":"Экономист упр. учёта","x":946,"y":971,"lp":"up"},{"id":"fin-3","line":"fin","col":3,"full":"Руководитель отдела управленческого учёта","short":"Рук. упр. учёта","x":1300,"y":1050,"lp":"right"},{"id":"ops-0","line":"ops","col":0,"full":"Специалист по приёму биоматериала","short":"Спец. приёма","x":200,"y":1030,"lp":"up"},{"id":"ops-1","line":"ops","col":1,"full":"Старший специалист по приёму биоматериала","short":"Ст. спец. приёма","x":432,"y":1030,"lp":"down"},{"id":"ops-2","line":"ops","col":2,"full":"Руководитель отдела проборазбора","short":"Рук. проборазбора","x":665,"y":1030,"lp":"up"},{"id":"ops-3","line":"ops","col":3,"full":"Офис-менеджер","short":"Офис-менеджер","x":897,"y":1030,"lp":"down"},{"id":"ops-4","line":"ops","col":4,"full":"Специалист отдела СМК","short":"Спец. СМК","x":1070,"y":1175,"lp":"up"},{"id":"ops-5","line":"ops","col":5,"full":"Ведущий специалист отдела СМК","short":"Ведущий спец. СМК","x":1300,"y":1180,"lp":"right"}],"hubs":[{"x":770,"y":324,"lines":["lab","tech"],"title":"Лаборатория ↔ технологии"},{"x":555,"y":540,"lines":["lab","rnd"],"title":"Лаборатория ↔ R&D"},{"x":740,"y":423,"lines":["eng","tech"],"title":"Технологии ↔ инженерия"},{"x":776,"y":840,"lines":["ops","cs"],"title":"Приём ↔ лаборатория и продажи"},{"x":742,"y":772,"lines":["fin","hr"],"title":"Финансы ↔ управление"},{"x":350,"y":290,"lines":["proc","hr"],"title":"Процессы ↔ управление"}]};

(function(){
  "use strict";
  const NS='http://www.w3.org/2000/svg', $=i=>document.getElementById(i);
  const svg=$('svg'), inp=$('edit');
  const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  const HEX={}; D.lines.forEach(l=>HEX[l.key]=l.hex);
  const CLONE=o=>JSON.parse(JSON.stringify(o));
  const INIT=CLONE({routes:D.routes,stations:D.stations,hubs:D.hubs});
  let R=CLONE(D.routes), S=CLONE(D.stations), H=CLONE(D.hubs);

  let vb={x:105,y:75,w:1400,h:1230};
  const gL=mk('g',{}),gV=mk('g',{}),gH=mk('g',{}),gS=mk('g',{});
  svg.appendChild(gL);svg.appendChild(gH);svg.appendChild(gS);svg.appendChild(gV);
  const vbApply=()=>svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  vbApply();
  const toSVG=ev=>{const r=svg.getBoundingClientRect();
    return {x:vb.x+(ev.clientX-r.left)/r.width*vb.w, y:vb.y+(ev.clientY-r.top)/r.height*vb.h};};
  const snap=v=>$('snap').checked?Math.round(v/10)*10:v;
  const dPath=p=>'M '+p.map(q=>q[0]+' '+q[1]).join(' L ');

  function draw(){
    gL.innerHTML='';gV.innerHTML='';gH.innerHTML='';gS.innerHTML='';
    // линии
    for(const k in R){
      const d=dPath(R[k]);
      gL.appendChild(mk('path',{d,class:'ln',stroke:HEX[k],'stroke-width':16,opacity:.14}));
      gL.appendChild(mk('path',{d,class:'ln',stroke:HEX[k],'stroke-width':9}));
      const pick=mk('path',{d,class:'ln pick','data-line':k}); gL.appendChild(pick);
    }
    // точки изгиба
    if($('mVtx').classList.contains('on'))
      for(const k in R) R[k].forEach((p,i)=>{
        gV.appendChild(mk('rect',{x:p[0]-5,y:p[1]-5,width:10,height:10,rx:2.5,
          class:'vtx'+((i===0||i===R[k].length-1)?' end':''),stroke:HEX[k],'data-l':k,'data-i':i}));
      });
    // пересадки
    H.forEach((h,i)=>{
      const g=mk('g',{class:'hub','data-h':i});
      g.appendChild(mk('circle',{cx:h.x,cy:h.y,r:22,fill:'transparent'}));
      g.appendChild(mk('circle',{cx:h.x,cy:h.y,r:15,fill:'#fff',stroke:'#0F172A','stroke-width':4}));
      const t=mk('text',{x:h.x,y:h.y+5,'text-anchor':'middle','font-size':14,'font-weight':800,fill:'#0F172A'});
      t.textContent='⇄'; t.setAttribute('pointer-events','none'); g.appendChild(t);
      gH.appendChild(g);
    });
    // станции
    S.forEach(s=>{
      const g=mk('g',{class:'st','data-id':s.id});
      g.appendChild(mk('circle',{cx:s.x,cy:s.y,r:20,fill:'transparent'}));
      g.appendChild(mk('circle',{cx:s.x,cy:s.y,r:11,class:'r',stroke:HEX[s.line]}));
      const rows=s.short.length>17?wrap(s.short):[s.short], LH=14.5, hgt=rows.length*LH;
      let x,y,anc;
      if(s.lp==='left'){x=s.x-17;anc='end';y=s.y-hgt/2+11.5;}
      else if(s.lp==='right'){x=s.x+17;anc='start';y=s.y-hgt/2+11.5;}
      else if(s.lp==='down'){x=s.x;anc='middle';y=s.y+22+11.5;}
      else {x=s.x;anc='middle';y=s.y-22-hgt+11.5;}
      const t=mk('text',{class:'lb',x,y,'text-anchor':anc});
      rows.forEach((r,i)=>{const ts=mk('tspan',{x,dy:i?LH:0});ts.textContent=r;t.appendChild(ts);});
      g.appendChild(t); s._t=t; gS.appendChild(g);
    });
    if(sel){const g=gS.querySelector('.st[data-id="'+sel+'"]'); if(g)g.classList.add('sel');}
    clashes();
  }
  function wrap(t){ const w=t.split(' '); if(w.length<2) return [t];
    let b=null,bd=1e9;
    for(let k=1;k<w.length;k++){const a=w.slice(0,k).join(' '),c=w.slice(k).join(' ');
      const d=Math.max(a.length,c.length); if(d<bd){bd=d;b=[a,c];}}
    return b; }
  function clashes(){
    let n=0; const bb=S.map(s=>({s,b:s._t.getBBox()}));
    bb.forEach(x=>x.s._t.classList.remove('clash'));
    for(let i=0;i<bb.length;i++)for(let j=i+1;j<bb.length;j++){
      const a=bb[i].b,c=bb[j].b;
      if(a.x<c.x+c.width+4&&c.x<a.x+a.width+4&&a.y<c.y+c.height+3&&c.y<a.y+a.height+3){
        n++;bb[i].s._t.classList.add('clash');bb[j].s._t.classList.add('clash');}
    }
    const e=$('cnt'); e.className='cnt '+(n?'bad':'ok');
    e.textContent=n?(n+' наложений'):'подписи чистые';
  }

  /* ---- взаимодействие ---- */
  let drag=null, pan=null, sel=null;
  svg.addEventListener('pointerdown',ev=>{
    if(ev.button===2) return;
    const v=ev.target.closest('.vtx');
    if(v && $('mVtx').classList.contains('on')){
      drag={t:'v',l:v.dataset.l,i:+v.dataset.i}; svg.setPointerCapture(ev.pointerId); return; }
    const h=ev.target.closest('.hub');
    if(h){ drag={t:'h',i:+h.dataset.h}; svg.setPointerCapture(ev.pointerId); return; }
    const st=ev.target.closest('.st');
    if(st && $('mSt').classList.contains('on')){
      const s=S.find(x=>x.id===st.dataset.id); const p=toSVG(ev);
      drag={t:'s',s,dx:p.x-s.x,dy:p.y-s.y}; sel=s.id; draw();
      svg.setPointerCapture(ev.pointerId); return; }
    pan={x:ev.clientX,y:ev.clientY,vx:vb.x,vy:vb.y}; svg.classList.add('grabbing');
  });
  svg.addEventListener('pointermove',ev=>{
    if(drag){ const p=toSVG(ev);
      if(drag.t==='v'){ R[drag.l][drag.i]=[snap(p.x),snap(p.y)]; }
      else if(drag.t==='h'){ H[drag.i].x=snap(p.x); H[drag.i].y=snap(p.y); }
      else { drag.s.x=snap(p.x-drag.dx); drag.s.y=snap(p.y-drag.dy); }
      draw();
    } else if(pan){ const r=svg.getBoundingClientRect();
      vb.x=pan.vx-(ev.clientX-pan.x)/r.width*vb.w; vb.y=pan.vy-(ev.clientY-pan.y)/r.height*vb.h; vbApply(); }
  });
  addEventListener('pointerup',()=>{drag=null;pan=null;svg.classList.remove('grabbing');});
  svg.addEventListener('wheel',ev=>{ev.preventDefault();
    const p=toSVG(ev),k=ev.deltaY>0?1.12:0.89;
    vb.x=p.x-(p.x-vb.x)*k; vb.y=p.y-(p.y-vb.y)*k; vb.w*=k; vb.h*=k; vbApply();},{passive:false});

  // двойной клик по линии — добавить излом; по станции — переименовать
  svg.addEventListener('dblclick',ev=>{
    const st=ev.target.closest('.st');
    if(st){ const s=S.find(x=>x.id===st.dataset.id);
      const r=svg.getBoundingClientRect();
      inp.value=s.short; inp.style.display='block';
      inp.style.left=((s.x-vb.x)/vb.w*r.width+r.left-125)+'px';
      inp.style.top=((s.y-vb.y)/vb.h*r.height+r.top-46)+'px';
      inp.focus(); inp.select(); inp._s=s; return; }
    const ln=ev.target.closest('.ln.pick');
    if(ln){ const k=ln.dataset.line, p=toSVG(ev), pts=R[k];
      let bi=1,bd=1e18;
      for(let i=0;i<pts.length-1;i++){
        const [ax,ay]=pts[i],[bx,by]=pts[i+1]; const dx=bx-ax,dy=by-ay;
        const u=(dx||dy)?Math.max(0,Math.min(1,((p.x-ax)*dx+(p.y-ay)*dy)/(dx*dx+dy*dy))):0;
        const d=Math.hypot(p.x-(ax+u*dx),p.y-(ay+u*dy));
        if(d<bd){bd=d;bi=i+1;}
      }
      pts.splice(bi,0,[snap(p.x),snap(p.y)]); draw(); }
  });
  // правый клик по излому — удалить
  svg.addEventListener('contextmenu',ev=>{
    const v=ev.target.closest('.vtx'); if(!v) return;
    ev.preventDefault(); const k=v.dataset.l,i=+v.dataset.i;
    if(R[k].length>2){ R[k].splice(i,1); draw(); }
  });
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') inp.blur(); if(e.key==='Escape'){inp._s=null;inp.style.display='none';} });
  inp.addEventListener('blur',()=>{ if(inp._s){inp._s.short=inp.value.trim()||inp._s.short;inp._s=null;} inp.style.display='none'; draw(); });
  addEventListener('keydown',e=>{
    if(e.key==='Tab'&&sel){ e.preventDefault();
      const s=S.find(x=>x.id===sel), o=['up','right','down','left'];
      s.lp=o[(o.indexOf(s.lp)+1)%4]; draw(); }
  });
  ['mVtx','mSt'].forEach(id=>$(id).onclick=()=>{$(id).classList.toggle('on');draw();});

  $('exp').onclick=()=>{
    const out={routes:R, stations:S.map(s=>({id:s.id,short:s.short,x:s.x,y:s.y,lp:s.lp})),
               hubs:H.map(h=>({x:h.x,y:h.y,lines:h.lines,title:h.title}))};
    const b=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(b);
    a.download='shema-metro-razmetka.json'; a.click();
  };
  $('imp').onclick=()=>$('file').click();
  $('file').onchange=e=>{const f=e.target.files[0];if(!f)return;
    const rd=new FileReader(); rd.onload=()=>{ try{ const j=JSON.parse(rd.result);
      if(j.routes) R=j.routes;
      if(j.stations){const m=Object.fromEntries(j.stations.map(x=>[x.id,x]));
        S.forEach(s=>{const q=m[s.id];if(q){s.x=q.x;s.y=q.y;s.lp=q.lp;s.short=q.short;}});}
      if(j.hubs) H=j.hubs;
      draw(); }catch(err){ alert('Не читается: '+err.message); } };
    rd.readAsText(f);};
  $('rst').onclick=()=>{ if(confirm('Вернуть исходную схему?')){
    R=CLONE(INIT.routes); S=CLONE(INIT.stations); H=CLONE(INIT.hubs); sel=null; draw(); } };

  draw();
})();
</script>
</body>
</html>
