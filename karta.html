<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Геномед — карта карьерных путей</title>
<style>
  html,body{margin:0;background:#F7F9FC;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .fr{width:100%;border:0;display:block;background:transparent}
  .sep{max-width:1320px;margin:0 auto;padding:0 32px;
    display:flex;align-items:center;gap:14px}
  .sep span{height:1px;flex:1;background:#E2E8F0}
  .sep b{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:#00AEEF;white-space:nowrap}
  @media(max-width:720px){ .sep{padding:0 16px} .sep b{font-size:.66rem;white-space:normal} }
</style>
</head>
<body>
<iframe class="fr" id="f1" src="karta-shema.html" title="Карта карьерных путей" style="height:1750px"></iframe>
<div class="sep"><span></span><b>Те же 17 треков прямыми линиями</b><span></span></div>
<iframe class="fr" id="f2" src="relsy.html" title="Карьерные пути прямыми линиями" style="height:2700px"></iframe>
<div class="sep"><span></span><b>Те же 17 треков по направлениям</b><span></span></div>
<iframe class="fr" id="f3" src="napravleniya.html" title="Карьерные пути по направлениям" style="height:2200px"></iframe>
<script>
/* подгоняем высоту под содержимое; если документ недоступен — остаётся запасная высота из style */
(function(){
  function fit(f){ try{ var d=f.contentDocument; if(!d||!d.body) return;
      var h=Math.max(d.body.scrollHeight, d.documentElement.scrollHeight);
      if(h>200) f.style.height=(h+32)+'px';
    }catch(e){} }
  ['f1','f2','f3'].forEach(function(id){ var f=document.getElementById(id);
    f.addEventListener('load',function(){ fit(f); [300,900,2000,4000].forEach(function(t){setTimeout(function(){fit(f);},t);}); });
    if(f.contentDocument&&f.contentDocument.readyState==='complete') fit(f);
  });
  addEventListener('resize',function(){ ['f1','f2','f3'].forEach(function(id){ fit(document.getElementById(id)); }); });
})();
</script>
</body>
</html>
