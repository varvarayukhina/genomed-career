<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Геномед — карьерные пути прямыми линиями</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1E293B;--muted:#64748B;--faint:#94A3B8;
    --sans:"Inter",-apple-system,sans-serif;--display:"Montserrat",var(--sans);
    --sh:0 6px 20px rgba(30,41,59,.08)}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:transparent;font-family:var(--sans);color:var(--ink);line-height:1.5;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1320px;margin:0 auto;padding:8px 32px 40px}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
  .chip{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;white-space:nowrap;
    background:#fff;border:1px solid #E2E8F0;border-radius:999px;padding:9px 15px;
    font-family:var(--display);font-weight:600;font-size:.86rem;color:var(--muted);
    box-shadow:var(--sh);transition:.16s cubic-bezier(.22,1,.36,1)}
  .chip .dot{width:9px;height:9px;border-radius:50%;background:#CBD5E1}
  .chip:hover{transform:translateY(-1px);color:var(--ink)}
  .chip.on{color:#fff;border-color:transparent;background:var(--cc,#1E293B)}
  .chip.on .dot{background:rgba(255,255,255,.9)}

  .grp{margin:0 0 6px}
  .grp__h{display:flex;align-items:baseline;gap:11px;margin:22px 0 2px;padding-left:2px}
  .grp__h b{font-family:var(--display);font-weight:800;font-size:.72rem;letter-spacing:.11em;
    text-transform:uppercase;color:var(--cc)}
  .grp__h span{font-size:.74rem;color:var(--faint)}

  .rail{position:relative;padding:26px 0 8px}
  .rail svg{width:100%;height:auto;display:block;overflow:visible}
  .rl{fill:none;stroke-linecap:round;stroke-width:9}
  .rl--case{stroke:#fff;stroke-width:15}
  .rl--fork{stroke-dasharray:2 14;stroke-linecap:round;opacity:.55}
  .dot{fill:#fff;stroke-width:3.4}
  .dot--end{stroke-width:5}
  .cap{font-family:var(--sans);font-weight:600;font-size:12.5px;fill:var(--ink);
    paint-order:stroke;stroke:#fff;stroke-width:3.6px;stroke-linejoin:round}
  .cap--end{font-weight:700}
  .vac{font-family:var(--display);font-weight:700;font-size:9px;letter-spacing:.05em;
    text-transform:uppercase;fill:#fff}
  /* бегущий по рельсу «поезд» */
  .train{fill:#fff;stroke-width:2.4}
  @media (prefers-reduced-motion: reduce){ .train{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <div class="chips" id="chips"></div>
  <div id="body"></div>
</div>

<script>
const D = {"dirs": [["lab", "Лаборатория", "#00AEEF"], ["tech", "Технологии и производство", "#14B8A6"], ["rnd", "R&D и наука", "#7C5CFC"], ["eng", "Инженерия", "#64748B"], ["cs", "Клиентский сервис и продажи", "#E24A8B"], ["proc", "Процессы и ИИ", "#FF8C42"], ["hr", "Персонал и управление", "#2BB673"], ["fin", "Финансы и учёт", "#F59E0B"], ["ops", "Приём и качество", "#EF4444"]], "rails": [{"dir": "lab", "hex": "#0091D5", "path": ["Лаборант", "Старший лаборант", "Молекулярный биолог", "Старший молекулярный биолог", "Заведующий отделом лаборатории"], "fork": 0}, {"dir": "tech", "hex": "#00A896", "path": ["Старший лаборант (NGS)", "Молекулярный биолог (NGS)", "Заведующий отделом пробоподготовки", "Заместитель заведующего лабораторией по технологиям", "Директор по техническому развитию (СТО)"], "fork": 0}, {"dir": "eng", "hex": "#5FCFC0", "path": ["Инженер-электроник", "Старший инженер-электроник", "Заместитель руководителя отдела производства, эксплуатации и ремонта"], "fork": 0}, {"dir": "rnd", "hex": "#7B61FF", "path": ["Лаборант (научно-производственный отдел)", "Старший специалист (научно-производственный отдел)", "Ведущий специалист (научно-производственный отдел)", "Заместитель руководителя департамента R&D"], "fork": 0}, {"dir": "cs", "hex": "#E8368F", "path": ["Менеджер по сопровождению клиентов B2C", "Менеджер по сопровождению клиентов В2С, В2В, B2D", "Ведущий менеджер по сопровождению клиентов В2С, В2В, B2D"], "fork": 0}, {"dir": "cs", "hex": "#F573AE", "path": ["Продакт-менеджер направления продаж продукции для молекулярно-биологических исследований", "Руководитель отдела прикладных решений и клиентской поддержки"], "fork": 0}, {"dir": "cs", "hex": "#B5177E", "path": ["Старший молекулярный биолог (лаборатория сервисных научных проектов)", "Менеджер по продажам услуг научного сервиса"], "fork": 0}, {"dir": "cs", "hex": "#FF9EC4", "path": ["Лаборант (лаборатория сервисных научных проектов)", "Менеджер по продажам услуг научного сервиса"], "fork": 0}, {"dir": "proc", "hex": "#FF8C42", "path": ["Специалист по процессному управлению", "Ведущий специалист по процессному управлению", "Руководитель отдела разработки искусственного интеллекта"], "fork": 0}, {"dir": "proc", "hex": "#FFB779", "path": ["Специалист по процессному управлению", "Ведущий специалист по процессному управлению", "Заместитель директора департамента процессного управления и развития"], "fork": 2}, {"dir": "hr", "hex": "#1DB954", "path": ["Менеджер по персоналу", "Ведущий менеджер по персоналу", "Руководитель ОКС", "Оперативный директор"], "fork": 0}, {"dir": "hr", "hex": "#00897B", "path": ["Руководитель ОКС", "Директор департамента процессного управления и развития"], "fork": 1}, {"dir": "hr", "hex": "#0E7C4A", "path": ["Менеджер по персоналу", "Директор по персоналу", "Заместитель генерального директора по управлению персоналом холдинга"], "fork": 1}, {"dir": "fin", "hex": "#F2C300", "path": ["Финансовый контролёр", "Заместитель руководителя отдела первичного учёта", "Руководитель отдела первичного учёта"], "fork": 0}, {"dir": "fin", "hex": "#FFDE5C", "path": ["Экономист по управленческому учёту", "Руководитель отдела управленческого учёта"], "fork": 0}, {"dir": "ops", "hex": "#E03131", "path": ["Специалист по приёму биоматериала", "Старший специалист по приёму биоматериала", "Руководитель отдела проборазбора"], "fork": 0}, {"dir": "ops", "hex": "#F58080", "path": ["Офис-менеджер", "Специалист отдела СМК", "Ведущий специалист отдела СМК"], "fork": 0}]};
const VAC = ["Лаборант","Специалист по приему биоматериала","Менеджер по сопровождению клиентов B2C",
 "Менеджер по продажам услуг научного сервиса (исследования в области молекулярной биологии и генетики)",
 "Лаборант (лаборатория сервисных научных проектов)"];

(function(){
  "use strict";
  const NS='http://www.w3.org/2000/svg', $=i=>document.getElementById(i);
  const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const norm=s=>s.trim().toLowerCase().replace(/ё/g,'е');
  const isVac=s=>VAC.some(v=>norm(v)===norm(s));
  const plural=(n,a,b,c)=>{const d=n%10,w=n%100;return (w>=11&&w<=14)?c:(d===1?a:(d>=2&&d<=4?b:c));};
  const NAME={},HEX={}; D.dirs.forEach(([k,n,h])=>{NAME[k]=n;HEX[k]=h;});

  const W=1200, X0=150, X1=1050;
  function wrap(t,mx){ const w=t.split(' '); const L=[''];
    w.forEach(x=>{ if(!L[L.length-1]) L[L.length-1]=x;
      else if((L[L.length-1]+' '+x).length<=mx) L[L.length-1]+=' '+x; else L.push(x); });
    return L; }

  /* один путь = одна прямая линия слева направо, без пересечений */
  function railSVG(r){
    const n=r.path.length, gap=(X1-X0)/Math.max(1,n-1);
    const rows=r.path.map(t=>wrap(t, n>3?22:30));
    const maxUp=Math.max(...rows.filter((_,i)=>i%2===0).map(x=>x.length),1);
    const maxDn=Math.max(...rows.filter((_,i)=>i%2===1).map(x=>x.length),1);
    const H=26+maxUp*15+maxDn*15+26, y=26+maxUp*15;
    const svg=mk('svg',{viewBox:`0 0 ${W} ${H}`,role:'img'});
    const d=`M ${X0} ${y} L ${X0+(n-1)*gap} ${y}`;
    svg.appendChild(mk('path',{d,class:'rl rl--case'}));
    const line=mk('path',{d,class:'rl'+(r.fork?' ':''),stroke:r.hex});
    svg.appendChild(line);
    if(r.fork){   /* общая часть пути показана пунктиром — дальше он расходится */
      const fd=`M ${X0} ${y} L ${X0+(r.fork-1)*gap} ${y}`;
      svg.appendChild(mk('path',{d:fd,class:'rl rl--fork',stroke:'#fff'}));
    }
    r.path.forEach((role,i)=>{
      const x=X0+i*gap, end=i===n-1;
      svg.appendChild(mk('circle',{cx:x,cy:y,r:end?11:8.5,class:'dot'+(end?' dot--end':''),stroke:r.hex}));
      if(end) svg.appendChild(mk('circle',{cx:x,cy:y,r:4.5,fill:r.hex}));
      const up=i%2===0, L=rows[i];
      const ty = up ? y-20-(L.length-1)*15 : y+34;
      const t=mk('text',{x,y:ty,'text-anchor':'middle',class:'cap'+(end?' cap--end':'')});
      L.forEach((s,k)=>{const ts=mk('tspan',{x,dy:k?15:0});ts.textContent=s;t.appendChild(ts);});
      svg.appendChild(t);
      if(isVac(role)){
        const bx=x+(end?20:17), by=y+13;   /* под линией, иначе бейдж закрывает кружок */
        svg.appendChild(mk('rect',{x:bx,y:by,width:64,height:16,rx:8,fill:r.hex}));
        const v=mk('text',{x:bx+32,y:by+11.5,'text-anchor':'middle',class:'vac'}); v.textContent='ВАКАНСИЯ';
        svg.appendChild(v);
      }
    });
    /* поезд бежит по рельсу */
    const tr=mk('circle',{r:4.5,cx:X0,cy:y,class:'train',stroke:r.hex});
    svg.appendChild(tr);
    tr._x0=X0; tr._x1=X0+(n-1)*gap; tr._y=y;
    TRAINS.push(tr);
    return svg;
  }
  const TRAINS=[];

  const body=$('body');
  D.dirs.forEach(([k,n,h])=>{
    const rs=D.rails.filter(r=>r.dir===k); if(!rs.length) return;
    const g=document.createElement('section');
    g.className='grp'; g.dataset.k=k; g.style.setProperty('--cc',h);
    const hd=document.createElement('div'); hd.className='grp__h';
    hd.innerHTML='<b>'+esc(n)+'</b><span>'+rs.length+' '+
      plural(rs.length,'путь','пути','путей')+'</span>';
    g.appendChild(hd);
    rs.forEach(r=>{ const w=document.createElement('div'); w.className='rail';
      w.appendChild(railSVG(r)); g.appendChild(w); });
    body.appendChild(g);
  });

  const ch=$('chips');
  const all=document.createElement('button');
  all.className='chip on'; all.dataset.k='all';
  all.innerHTML='<span class="dot"></span>Все направления'; ch.appendChild(all);
  D.dirs.forEach(([k,n,h])=>{ const c=document.createElement('button');
    c.className='chip'; c.dataset.k=k; c.style.setProperty('--cc',h);
    c.innerHTML='<span class="dot" style="background:'+h+'"></span>'+esc(n); ch.appendChild(c); });
  ch.addEventListener('click',e=>{ const c=e.target.closest('.chip'); if(!c) return;
    [...ch.children].forEach(x=>x.classList.toggle('on',x===c));
    [...body.children].forEach(s=>s.style.display=(c.dataset.k==='all'||s.dataset.k===c.dataset.k)?'':'none');
  });

  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    let last=performance.now();
    TRAINS.forEach((t,i)=>{ t._t=i*0.13%1; t._sp=0.055+((i*37)%13)/260; });
    (function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now;
      TRAINS.forEach(t=>{ t._t=(t._t+dt*t._sp)%1;
        t.setAttribute('cx',(t._x0+(t._x1-t._x0)*t._t).toFixed(1)); });
      requestAnimationFrame(loop); })(last);
  }
  console.info('[прямые линии] путей:',D.rails.length);
})();
</script>
</body>
</html>
