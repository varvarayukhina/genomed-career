<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Геномед — фотогалерея по разделам</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F8FAFC; --ink:#1E293B; --muted:#64748B; --faint:#94A3B8;
    --blue:#00AEEF; --cyan-btn:#0093C9; --cyan-btn-600:#0079AC;
    --shadow-sm:0 6px 20px rgba(30,41,59,.08);
    --sans:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif;
    --display:"Montserrat",var(--sans);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.5;
    -webkit-font-smoothing:antialiased;overflow-x:hidden}
  .wrap{max-width:1320px;margin:0 auto;padding:0 32px;overflow-x:clip}
  .top{padding:52px 0 8px}
  .eyebrow{font-family:var(--display);font-weight:700;font-size:.74rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--blue);display:inline-flex;align-items:center;gap:.5em}
  .eyebrow::before{content:"";width:22px;height:2px;background:var(--blue);border-radius:2px}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,3.6vw,2.9rem);
    letter-spacing:-.02em;margin:14px 0 0;line-height:1.1}
  .lead{color:var(--muted);font-size:1.05rem;margin:14px 0 0;max-width:56em}

  .navbar{position:sticky;top:0;z-index:50;background:rgba(248,250,252,.92);
    backdrop-filter:blur(10px);border-bottom:1px solid #E7EDF4;margin-top:26px}
  .navbar__in{max-width:1320px;margin:0 auto;padding:12px 32px;display:flex;gap:8px;
    overflow-x:auto;min-width:0;scrollbar-width:none}
  .navbar__in::-webkit-scrollbar{display:none}
  .chip{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;white-space:nowrap;
    background:#fff;border:1px solid #E2E8F0;border-radius:999px;padding:9px 15px;
    font-family:var(--display);font-weight:600;font-size:.86rem;color:var(--muted);
    transition:.18s cubic-bezier(.22,1,.36,1);box-shadow:var(--shadow-sm)}
  .chip:hover{transform:translateY(-1px);color:var(--ink)}
  .chip.is-on{color:#fff;background:var(--ink);border-color:transparent}
  .chip b{font-weight:700;opacity:.55;font-size:.8rem}
  .chip.is-on b{opacity:.8}

  .sec{padding:44px 0 8px;scroll-margin-top:76px}
  .sec:last-child{padding-bottom:60px}
  .more{margin:16px 0 0;display:inline-flex;align-items:center;gap:8px;cursor:pointer;
    background:#fff;border:1px solid #E2E8F0;border-radius:999px;padding:11px 20px;
    font-family:var(--display);font-weight:700;font-size:.86rem;color:var(--ink);
    box-shadow:var(--shadow-sm);transition:.18s cubic-bezier(.22,1,.36,1)}
  .more:hover{transform:translateY(-1px);border-color:var(--blue);color:var(--blue)}
  .sec__head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .sec h2{font-family:var(--display);font-weight:800;font-size:1.55rem;letter-spacing:-.01em;margin:0}
  .sec__n{font-family:var(--display);font-weight:700;font-size:.8rem;color:var(--faint);
    background:#fff;border:1px solid #E7EDF4;border-radius:999px;padding:4px 11px}
  .sec__desc{color:var(--muted);font-size:.98rem;margin:10px 0 0;max-width:62em}


  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .tile{position:relative;display:block;aspect-ratio:1;border-radius:16px;overflow:hidden;
    background:#EEF3F8;cursor:zoom-in;border:none;padding:0;transition:.22s cubic-bezier(.22,1,.36,1)}
  .tile img,.tile>video{width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .4s cubic-bezier(.22,1,.36,1);pointer-events:none}
  .tile:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(30,41,59,.16)}
  .tile:hover img,.tile:hover>video{transform:scale(1.06)}
  .tile:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .tile__play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
    background:linear-gradient(180deg,rgba(15,23,42,0) 45%,rgba(15,23,42,.45))}
  .tile__play span{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.92);
    display:grid;place-items:center;box-shadow:0 6px 18px rgba(15,23,42,.3)}
  .tile__play svg{margin-left:3px;color:#0F172A}
  .tile__tag{position:absolute;left:10px;top:10px;font-family:var(--display);font-weight:700;
    font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:#fff;
    background:rgba(15,23,42,.72);border-radius:999px;padding:4px 9px;pointer-events:none}

  .lb{position:fixed;inset:0;z-index:90;background:rgba(8,15,30,.93);display:none;
    align-items:center;justify-content:center;padding:32px}
  .lb.on{display:flex}
  .lb img,.lb video{max-width:100%;max-height:86vh;border-radius:14px;display:block;
    box-shadow:0 30px 90px rgba(0,0,0,.6)}
  .lb__x,.lb__p,.lb__n{position:absolute;background:rgba(255,255,255,.12);border:none;cursor:pointer;
    color:#fff;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;transition:.18s}
  .lb__x:hover,.lb__p:hover,.lb__n:hover{background:rgba(255,255,255,.26)}
  .lb__x{top:20px;right:22px}
  .lb__p{left:18px;top:50%;transform:translateY(-50%)}
  .lb__n{right:18px;top:50%;transform:translateY(-50%)}
  .lb__cap{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#CBD5E1;
    font-size:.86rem;font-weight:600;text-align:center;padding:0 60px}

  .note{margin:44px 0 60px;padding:16px 18px;border-radius:16px;background:#fff;
    border:1px solid #E7EDF4;box-shadow:var(--shadow-sm);color:var(--muted);font-size:.9rem;line-height:1.6}
  .note b{color:var(--ink)}

  @media(max-width:960px){
    .wrap{padding:0 18px}
    .navbar__in{padding:10px 18px}
    .top{padding:34px 0 8px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}
    .lb{padding:14px}
    .lb__p,.lb__n{width:40px;height:40px}
  }
</style>
</head>
<body>

<div class="wrap top">
  <span class="eyebrow">Фотогалерея</span>
  <h1>Как всё устроено изнутри</h1>
  <p class="lead">Лаборатория, команда и будни: спортивные турниры, выездные корпоративы, мастер-классы и совместные праздники. Разделы — по темам, внутри каждого — от новых кадров к старым.</p>
</div>

  <button class="lb__p" id="lbP" aria-label="Предыдущее"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="lb__n" id="lbN" aria-label="Следующее"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>

genomed.ru/wp-content/uploads/vacancy/gallery/2019/photo_2024-11-02_17-55-02_470x470_be4.jpg", "date": "2024-11-02", "video": false}, {"i": 284, "src": "https://genomed.ru/wp-content/uploads/vacancy/gallery/2019/photo_2024-11-02_17-54-36_1280x0_426.jpg", "thumb": "https://genomed.ru/wp-content/uploads/vacancy/gallery/2019/photo_2024-11-02_17-54-36_470x470_be4.jpg", "date": "2024-11-02", "video": false}, {"i": 285, "src": "https://genomed.ru/wp-content/uploads/vacancy/gallery/2019/photo_2024-11-02_17-54-01_1280x0_426.jpg", "thumb": "https://genomed.ru/wp-content/uploads/vacancy/gallery/2019/photo_2024-11-02_17-54-01_470x470_be4.jpg", "date": "2024-11-02", "video": false}, {"i": 287, "src": "https://genomed.ru/wp-content/uploads/vacancy/gallery/2019/photo_2024-11-02_17-50-57_1280x0_426.jpg", "thumb": "https://genomed.ru/wp-content/uploads/vacancy/gallery/2019/photo_2024-11-02_17-50-57_470x470_be4.jpg", "date": "2024-11-02", "video": false}, {"i": 288, "src": "https://genomed.ru/wp-content/uploads/vacancy/gallery/2019/photo_2024-11-02_17-50-57 (2)_1280x0_426.jpg", "thumb": "https://genomed.ru/wp-content/uploads/vacancy/gallery/2019/photo_2024-11-02_17-50-57 (2)_470x470_be4.jpg", "date": "2024-11-02", "video": false}, {"i": 289, "src": "https://genomed.ru/wp-content/uploads/vacancy/gallery/2019/photo_2024-11-02_17-50-56_1280x0_426.jpg", "thumb": "https://genomed.ru/wp-content/uploads/vacancy/gallery/2019/photo_2024-11-02_17-50-56_470x470_be4.jpg", "date": "2024-11-02", "video": false}]}];

(function(){
  "use strict";
  const $=id=>document.getElementById(id);
  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const plural=(n,a,b,c)=>{const d=n%10,w=n%100;return (w>=11&&w<=14)?c:(d===1?a:(d>=2&&d<=4?b:c));};
  const PLAY='<span><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></span>';

  /* плоский список для навигации стрелками в просмотрщике */
  const FLAT=[]; SECTIONS.forEach(s=>s.items.forEach(p=>FLAT.push(Object.assign({sec:s.name},p))));
  const pos={}; FLAT.forEach((p,i)=>pos[p.i]=i);

  /* ---- навигация по разделам ---- */
  const nav=$('nav');
  const all=document.createElement('button');
  all.className='chip is-on'; all.dataset.sec='all';
  all.innerHTML='Все разделы <b>'+FLAT.length+'</b>'; nav.appendChild(all);
  SECTIONS.forEach(s=>{ const b=document.createElement('button');
    b.className='chip'; b.dataset.sec=s.id;
    b.innerHTML=esc(s.name)+' <b>'+s.count+'</b>'; nav.appendChild(b); });

  /* ---- разделы ---- */
  const body=$('body');
  SECTIONS.forEach(s=>{
    const sec=document.createElement('section');
    sec.className='sec'; sec.id='sec'+s.id; sec.dataset.sec=s.id;
    let h='<div class="sec__head"><h2>'+esc(s.name)+'</h2>'+
          '<span class="sec__n">'+s.count+' '+plural(s.count,'материал','материала','материалов')+'</span></div>'+
          '<p class="sec__desc">'+esc(s.desc)+'</p>';
    h+='<div class="grid">';
    s.items.forEach(p=>{
      /* у видео на сайте нет картинки-превью, поэтому превью — первый кадр самого файла:
         #t=0.5 заставляет браузер отрисовать кадр, preload=metadata не тянет весь ролик */
      h+='<button class="tile" data-i="'+p.i+'">'+
         (p.video
           ? '<video src="'+esc(p.src)+'#t=0.5" muted playsinline preload="metadata"></video>'+
             '<span class="tile__play">'+PLAY+'</span><span class="tile__tag">видео</span>'
           : '<img src="'+esc(p.thumb)+'" alt="'+esc(s.name)+'" loading="lazy" decoding="async">')+
         '</button>';
    });
    h+='</div>';
    h+='<button class="more">Показать весь раздел — '+s.count+' '+
       plural(s.count,'материал','материала','материалов')+
       '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>';
    sec.innerHTML=h; body.appendChild(sec);
  });

  /* ---- выбор раздела ----
     по умолчанию каждый раздел показан «превью» — первые PREVIEW кадров,
     чтобы галерея не занимала всю страницу; клик по чипу раскрывает один раздел
     целиком, кнопка внутри раздела раскрывает его, не уходя с общего вида */
  const PREVIEW=10;
  function tiles(sec){ return [...sec.querySelectorAll('.tile')]; }
  function collapse(sec){
    const t=tiles(sec);
    t.forEach((x,i)=>{ x.style.display = i<PREVIEW ? '' : 'none'; });
    const more=sec.querySelector('.more');
    if(more) more.style.display = t.length>PREVIEW ? '' : 'none';
    sec.dataset.open='0';
  }
  function expand(sec){
    tiles(sec).forEach(x=>x.style.display='');
    const more=sec.querySelector('.more'); if(more) more.style.display='none';
    sec.dataset.open='1';
  }
  const secEls=[...body.children];
  secEls.forEach(collapse);

  nav.addEventListener('click',e=>{
    const c=e.target.closest('.chip'); if(!c) return;
    [...nav.children].forEach(x=>x.classList.toggle('is-on',x===c));
    const k=c.dataset.sec;
    secEls.forEach(sec=>{
      const on = k==='all' || sec.dataset.sec===k;
      sec.style.display = on?'':'none';
      if(k==='all') collapse(sec); else if(on) expand(sec);
    });
    window.scrollTo({top:0,behavior:'smooth'});
  });
  body.addEventListener('click',e=>{
    const b=e.target.closest('.more'); if(!b) return;
    expand(b.closest('.sec'));
  });  /* ---- просмотрщик ---- */
  const lb=$('lb'), slot=$('lbSlot'), cap=$('lbCap');
  let cur=-1;
  function show(i){
    if(i<0||i>=FLAT.length) return;
    cur=i; const p=FLAT[i];
    slot.innerHTML = p.video
      ? '<video src="'+esc(p.src)+'" controls autoplay playsinline></video>'
      : '<img src="'+esc(p.src)+'" alt="'+esc(p.sec)+'">';
    cap.textContent=p.sec+'  ·  '+(i+1)+' из '+FLAT.length;
    lb.classList.add('on'); document.body.style.overflow='hidden';
  }
  function close(){ lb.classList.remove('on'); slot.innerHTML=''; document.body.style.overflow=''; }
  body.addEventListener('click',e=>{ const t=e.target.closest('.tile'); if(t) show(pos[+t.dataset.i]); });
  $('lbX').onclick=close;
  $('lbP').onclick=e=>{e.stopPropagation();show(cur-1);};
  $('lbN').onclick=e=>{e.stopPropagation();show(cur+1);};
  lb.addEventListener('click',e=>{ if(e.target===lb) close(); });
  document.addEventListener('keydown',e=>{ if(!lb.classList.contains('on'))return;
    if(e.key==='Escape')close(); if(e.key==='ArrowLeft')show(cur-1); if(e.key==='ArrowRight')show(cur+1); });

  console.info('[фотогалерея] разделов:',SECTIONS.length,'| материалов:',FLAT.length,
    '| видео:',FLAT.filter(p=>p.video).length);
})();
</script>
</body>
</html>
